<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>유치부 기능 배치</title>
</head>

<body>

    <div class="header-wrapper">
        <h2>유치부 기능 배치</h2>
        <div class="header-buttons">
            <button class="header-btn header-add-btn" onclick="openAddModal()">추가</button>
            <button class="header-btn header-delete-btn" onclick="openDeleteModal()">삭제</button>
        </div>
    </div>

    <div class="form-container">

        <!-- 날짜 및 주제 -->
        <div class="section-card">
            <h3>기본 정보</h3>
            <div class="row">
                <div class="col">
                    <label for="select-date">날짜 선택</label>
                    <input type="date" id="select-date">
                </div>
                <div class="col">
                    <label for="feature-topic">기능 주제</label>
                    <input type="text" id="feature-topic" readonly placeholder="날짜를 선택하면 자동 입력됩니다">
                </div>
            </div>
        </div>

        <!-- 찬양 정보 -->
        <div class="section-card">
            <h3>찬양 및 영상</h3>
            <div class="row">
                <div class="col">
                    <div class="input-group">
                        <label for="current-praise">이번 주 찬율</label>
                        <input type="text" id="current-praise" readonly placeholder="자동 입력됩니다">
                    </div>
                </div>
                <div class="col">
                    <div class="input-group">
                        <label for="last-praise">지난 주 찬율</label>
                        <input type="text" id="last-praise" readonly placeholder="자동 입력됩니다">
                    </div>
                </div>
            </div>

            <div style="margin-top: 15px;">
                <div class="input-group">
                    <label for="motion-link">이번 주 손유희 링크</label>
                    <input type="text" id="motion-link" readonly placeholder="자동 입력됩니다">
                </div>
                <div class="input-group">
                    <label for="current-praise-video">이번 주 찬율 영상 링크</label>
                    <input type="text" id="current-praise-video" readonly placeholder="자동 입력됩니다">
                </div>
                <div class="input-group">
                    <label for="last-praise-video">저번 주 찬율 영상 링크</label>
                    <input type="text" id="last-praise-video" readonly placeholder="자동 입력됩니다">
                </div>
            </div>
        </div>

        <!-- 담당자 (Grid Layout) -->
        <div class="section-card">
            <h3>담당자 선택</h3>
            <div class="grid-3">

                <div>
                    <label>찬송</label>
                    <div class="input-with-btn">
                        <input type="text" id="person-praise" readonly placeholder>
                        <button onclick="openModal('person-praise')">선택</button>
                    </div>
                </div>

                <div>
                    <label>찬율</label>
                    <div class="input-with-btn">
                        <input type="text" id="person-lyric" readonly placeholder>
                        <button onclick="openModal('person-lyric')">선택</button>
                    </div>
                </div>

                <div>
                    <label>피아노</label>
                    <div class="input-with-btn">
                        <input type="text" id="piano" readonly placeholder>
                        <button onclick="openModal('piano')">선택</button>
                    </div>
                </div>
                <div>
                    <label>손유희</label>
                    <div class="input-with-btn">
                        <input type="text" id="person-motion" readonly placeholder>
                        <button onclick="openModal('person-motion')">선택</button>
                    </div>
                </div>

                <div>
                    <label>암송</label>
                    <div class="input-with-btn">
                        <input type="text" id="recitation" readonly placeholder>
                        <button onclick="openModal('recitation')">선택</button>
                    </div>
                </div>

                <div>
                    <label>체조</label>
                    <div class="input-with-btn">
                        <input type="text" id="gymnastics" readonly placeholder>
                        <button onclick="openModal('gymnastics')">선택</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 출력 박스 -->
        <div class="section-card">
            <h3>메시지 생성이 완료되었습니다</h3>
            <textarea id="final-message" readonly></textarea>
            <button onclick="copyMessage()">복사하기</button>
        </div>

    </div>

    <!-- Modal Structure -->
    <div id="nameModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">담당자 선택</div>
            <div class="name-grid" id="nameGrid">
                <!-- Buttons will be injected here via JS -->
            </div>
            <button class="close-btn" onclick="closeModal()">닫기</button>
        </div>
    </div>

    <!-- Add Modal Structure -->
    <div id="addModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">담당자 직접 추가</div>
            
            <label style="margin-bottom: 8px;">구분 선택</label>
            <div class="category-grid" id="categoryGrid">
                <button class="category-btn" onclick="selectCategory('praise', this)">찬송</button>
                <button class="category-btn" onclick="selectCategory('lyric', this)">찬율</button>
                <button class="category-btn" onclick="selectCategory('piano', this)">피아노</button>
                <button class="category-btn" onclick="selectCategory('motion', this)">손유희</button>
                <button class="category-btn" onclick="selectCategory('recitation', this)">암송</button>
                <button class="category-btn" onclick="selectCategory('gymnastics', this)">체조</button>
            </div>

            <div style="margin-top: 20px; margin-bottom: 24px;">
                <label for="custom-name-input">이름 입력</label>
                <input type="text" id="custom-name-input" placeholder="이름을 입력해 주세요">
            </div>

            <div class="modal-footer-btns">
                <button class="add-confirm-btn" onclick="confirmAdd()">추가하기</button>
                <button class="close-btn" onclick="closeAddModal()" style="margin-top: 0;">취소</button>
            </div>
        </div>
    </div>

    <!-- Delete Modal Structure -->
    <div id="deleteModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">담당자 명단 삭제</div>
            
            <label style="margin-bottom: 8px;">구분 선택</label>
            <div class="category-grid" id="deleteCategoryGrid">
                <button class="category-btn" onclick="selectDeleteCategory('praise', this)">찬송</button>
                <button class="category-btn" onclick="selectDeleteCategory('lyric', this)">찬율</button>
                <button class="category-btn" onclick="selectDeleteCategory('piano', this)">피아노</button>
                <button class="category-btn" onclick="selectDeleteCategory('motion', this)">손유희</button>
                <button class="category-btn" onclick="selectDeleteCategory('recitation', this)">암송</button>
                <button class="category-btn" onclick="selectDeleteCategory('gymnastics', this)">체조</button>
            </div>

            <div style="margin-top: 20px; margin-bottom: 24px;">
                <label id="delete-list-label" style="display: block; margin-bottom: 10px;">명단 (구분을 선택하면 표시됩니다)</label>
                <div class="delete-name-list" id="deleteNameList">
                    <!-- Names with delete buttons will be injected here -->
                </div>
            </div>

            <button class="close-btn" onclick="closeDeleteModal()" style="margin-top: 0;">닫기</button>
        </div>
    </div>

            const modal = document.getElementById('nameModal');
            const nameGrid = document.getElementById('nameGrid');

            // targetId에 맞는 명단 가져오기
            const displayNames = categoryNames[targetId] || [];

            // 이름 버튼 생성
            nameGrid.innerHTML = '';

            displayNames.forEach(name => {
                const btn = document.createElement('button');
                btn.className = 'name-btn';
                btn.innerText = name;
                btn.onclick = () => selectName(name);
                nameGrid.appendChild(btn);
            });

            // "선택 안함" 버튼 추가
            const clearBtn = document.createElement('button');
            clearBtn.className = 'name-btn';
            clearBtn.innerText = '선택 안함';
            clearBtn.style.color = '#868e96';
            clearBtn.onclick = () => selectName('');
            nameGrid.appendChild(clearBtn);

            modal.style.display = 'flex';
        }

        // 이름 선택 시
        function selectName(name) {
            if (currentTargetId) {
                document.getElementById(currentTargetId).value = name;
                generateMessage(); // 값 변경 후 메시지 재생성
            }
            closeModal();
        }

        // 모달 닫기
        function closeModal() {
            document.getElementById('nameModal').style.display = 'none';
            currentTargetId = null;
        }

        // 직접 추가 모달 열기
        function openAddModal() {
            selectedAddCategories = [];
            document.getElementById('custom-name-input').value = '';
            
            const buttons = document.querySelectorAll('#categoryGrid .category-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            document.getElementById('addModal').style.display = 'flex';
        }

        // 구분 선택 시 (중복 선택 가능 토글)
        function selectCategory(category, element) {
            const index = selectedAddCategories.indexOf(category);
            if (index > -1) {
                selectedAddCategories.splice(index, 1);
                element.classList.remove('active');
            } else {
                selectedAddCategories.push(category);
                element.classList.add('active');
            }
        }

        // 직접 추가 모달 닫기
        function closeAddModal() {
            document.getElementById('addModal').style.display = 'none';
        }

        // 직접 추가 확인
        function confirmAdd() {
            if (selectedAddCategories.length === 0) {
                alert('구분을 최소 하나 이상 선택해 주세요 (찬송, 찬율 등).');
                return;
            }

            const nameInput = document.getElementById('custom-name-input');
            const newName = nameInput.value.trim();

            if (!newName) {
                alert('이름을 입력해 주세요.');
                return;
            }

            const categoryMap = {
                'praise': 'person-praise',
                'lyric': 'person-lyric',
                'piano': 'piano',
                'motion': 'person-motion',
                'recitation': 'recitation',
                'gymnastics': 'gymnastics'
            };

            // 선택한 모든 카테고리의 명단에 이름 추가 (메인 인풋에는 바로 할당하지 않음)
            selectedAddCategories.forEach(category => {
                const targetId = categoryMap[category];
                if (targetId && categoryNames[targetId]) {
                    const list = categoryNames[targetId];
                    if (!list.includes(newName)) {
                        list.push(newName);
                    }
                }
            });

            closeAddModal();
        }

        let selectedDeleteCategory = null;

        // 직접 삭제 모달 열기
        function openDeleteModal() {
            selectedDeleteCategory = null;
            document.getElementById('deleteNameList').innerHTML = '';
            document.getElementById('delete-list-label').innerText = '명단 (구분을 선택하면 표시됩니다)';
            
            const buttons = document.querySelectorAll('#deleteCategoryGrid .category-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            document.getElementById('deleteModal').style.display = 'flex';
        }

        // 삭제 구분 선택 시
        function selectDeleteCategory(category, element) {
            selectedDeleteCategory = category;
            
            const buttons = document.querySelectorAll('#deleteCategoryGrid .category-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            
            const categoryLabelMap = {
                'praise': '찬송',
                'lyric': '찬율',
                'piano': '피아노',
                'motion': '손유희',
                'recitation': '암송',
                'gymnastics': '체조'
            };
            
            document.getElementById('delete-list-label').innerText = `[${categoryLabelMap[category]}] 명단`;
            renderDeleteNameList();
        }

        // 삭제할 이름 리스트 렌더링
        function renderDeleteNameList() {
            const deleteNameList = document.getElementById('deleteNameList');
            deleteNameList.innerHTML = '';

            if (!selectedDeleteCategory) return;

            const categoryMap = {
                'praise': 'person-praise',
                'lyric': 'person-lyric',
                'piano': 'piano',
                'motion': 'person-motion',
                'recitation': 'recitation',
                'gymnastics': 'gymnastics'
            };

            const targetId = categoryMap[selectedDeleteCategory];
            const list = categoryNames[targetId] || [];

            if (list.length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.style.color = '#868e96';
                emptyMsg.style.fontSize = '0.95rem';
                emptyMsg.style.textAlign = 'center';
                emptyMsg.style.padding = '20px 0';
                emptyMsg.innerText = '등록된 담당자가 없습니다.';
                deleteNameList.appendChild(emptyMsg);
                return;
            }

            list.forEach(name => {
                const item = document.createElement('div');
                item.className = 'delete-name-item';

                const nameSpan = document.createElement('span');
                nameSpan.innerText = name;

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-item-btn';
                delBtn.innerText = '삭제';
                delBtn.onclick = () => deleteNameItem(name);

                item.appendChild(nameSpan);
                item.appendChild(delBtn);
                deleteNameList.appendChild(item);
            });
        }

        // 이름 삭제 실행
        function deleteNameItem(name) {
            if (!selectedDeleteCategory) return;

            const categoryMap = {
                'praise': 'person-praise',
                'lyric': 'person-lyric',
                'piano': 'piano',
                'motion': 'person-motion',
                'recitation': 'recitation',
                'gymnastics': 'gymnastics'
            };

            const targetId = categoryMap[selectedDeleteCategory];
            const list = categoryNames[targetId];
            
            if (list) {
                const index = list.indexOf(name);
                if (index > -1) {
                    list.splice(index, 1);
                }
            }

            // 만약 메인 페이지의 입력 필드에 입력된 값이 삭제한 이름과 같다면 비우기
            const targetInput = document.getElementById(targetId);
            if (targetInput && targetInput.value === name) {
                targetInput.value = '';
                generateMessage(); // 메시지 재생성
            }

            renderDeleteNameList();
        }

        // 직접 삭제 모달 닫기
        function closeDeleteModal() {
            document.getElementById('deleteModal').style.display = 'none';
        }

        // 모달 바깥 클릭 시 닫기
        window.onclick = function (event) {
            const nameModal = document.getElementById('nameModal');
            const addModal = document.getElementById('addModal');
            const deleteModal = document.getElementById('deleteModal');
            if (event.target == nameModal) {
                closeModal();
            } else if (event.target == addModal) {
                closeAddModal();
            } else if (event.target == deleteModal) {
                closeDeleteModal();
            }
        }



        document.getElementById("select-date").addEventListener("change", function () {
            const selectedDate = new Date(this.value);
            const diffTime = selectedDate - startDate;
            const weekNumber = Math.floor(diffTime / (7 * 24 * 60 * 60 * 1000)) + 1;
            // 날짜
            if (weekNumber < 1 || weekNumber > 52) {
                alert("2026년 1월 4일 ~ 1년치(1과~52과)만 지원됩니다.");
                return;
            }

            // 기능 주제 (Input)
            document.getElementById("feature-topic").value = topics[weekNumber - 1] || "";

            // 이번 주 찬율 (Input)
            document.getElementById("current-praise").value = praises[weekNumber - 1] || "";

            // 지난 주 찬율 (Input)
            if (weekNumber > 1) {
                document.getElementById("last-praise").value = praises[weekNumber - 2] || "";
            } else {
                document.getElementById("last-praise").value = "지난 주 없음";
            }

            // 손유희 링크
            document.getElementById("motion-link").value = motionLinks[weekNumber - 1];

            document.getElementById("current-praise-video").value = currentPraiseVideos[weekNumber - 1];
            document.getElementById("last-praise-video").value = weekNumber > 1 ? currentPraiseVideos[weekNumber - 2] : "";

            generateMessage();

        });

        // 기존 addEventListener 제거 (불필요)
        /*
        document.getElementById('person-praise').addEventListener('change', (e) => { console.log('찬송 담당자:', e.target.value); });
        // ... 기타 리스너들 제거
        */

        function generateMessage() {
            const rawDate = document.getElementById("select-date").value;
            // Date가 유효하지 않으면 중단
            if (!rawDate) return;

            const selectedDateObj = new Date(rawDate);
            const formattedDate = `${selectedDateObj.getMonth() + 1}월 ${selectedDateObj.getDate()}일`;

            const weekIndex = getWeekIndex(rawDate);

            const featureTopic = document.getElementById("feature-topic").value;
            const currentPraise = document.getElementById("current-praise").value;
            const lastPraise = document.getElementById("last-praise").value;
            const motionLink = document.getElementById("motion-link").value;
            const currentVideo = document.getElementById("current-praise-video").value;
            const lastVideo = document.getElementById("last-praise-video").value;

            // 담당자들 (이제 Input 값)
            const personPraise = document.getElementById("person-praise").value;
            const personLyric = document.getElementById("person-lyric").value;
            const personPiano = document.getElementById("piano").value;
            const personMotion = document.getElementById("person-motion").value;
            const personMemory = document.getElementById("recitation").value;
            const personExercise = document.getElementById("gymnastics").value;

            const message =
                `${formattedDate} 기능 - ${featureTopic}
-------------------------------------------
찬송: ${personPraise}
율동: ${personLyric}
피아노: ${personPiano}
손유희: ${personMotion}
암송: ${personMemory}
체조: ${personExercise}
-------------------------------------------
지난 주 찬율: ${lastPraise}
이번 주 찬율: ${currentPraise}
이번 주 손유희: ${motionLink}
${lastPraise.replace(/^.*과\s/, '')} : ${lastVideo}
${currentPraise.replace(/^.*과\s/, '')} : ${currentVideo}`;

            document.getElementById("final-message").value = message;
        }

        function copyMessage() {
            const textarea = document.getElementById("final-message");
            textarea.select();
            document.execCommand("copy");
            alert("복사되었습니다!");
        }

        // 선택값 변경될 때마다 자동 생성
        document.querySelectorAll("select, input[type='date']").forEach(el => {
            el.addEventListener("change", generateMessage);
        });

        // 주차 계산 함수 예시 (기존 코드에서 사용 중)
        function getWeekIndex(dateStr) {
            const startDate = new Date("2026-01-04");
            const selected = new Date(dateStr);
            const diff = selected - startDate;
            return Math.floor(diff / (7 * 24 * 60 * 60 * 1000)); // 0-based index
        }
    </script>
</body>
